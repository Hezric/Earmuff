name: Release reminder
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch:
    inputs:
      scenario:
        description: Exercise a release threshold
        type: choice
        default: normal
        options: [normal, security, breaking, count, age, below]
permissions:
  contents: read
  issues: write
jobs:
  remind:
    uses: Hezric/Linen/.github/workflows/release-reminder.yml@v0.1.4
    with:
      scenario: ${{ inputs.scenario || 'normal' }}