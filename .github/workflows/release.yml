name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing signed tag to retry
        required: true
permissions:
  contents: write
jobs:
  release:
    uses: Hezric/Linen/.github/workflows/windows-release.yml@v0.3.2
    with:
      tag: ${{ inputs.tag || github.ref_name }}
      version-fields: '{"package.json":[".version"],"package-lock.json":[".version",".packages[\"\"].version"],"src-tauri/Cargo.toml":[".package.version"],"src-tauri/Cargo.lock":[".package[] | select(.name == \"earmuff\") | .version"],"src-tauri/tauri.conf.json":[".version"]}'
