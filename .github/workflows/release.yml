name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing signed tag to retry
        required: true
permissions:
  contents: write
jobs:
  release:
    uses: Hezric/Linen/.github/workflows/windows-release.yml@v0.1.4
    with:
      tag: ${{ inputs.tag || github.ref_name }}
