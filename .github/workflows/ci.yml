name: CI
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: npm test
      - name: Build frontend and app
        run: npm run tauri -- build --ci --no-bundle -- --locked
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: commit-check/commit-check-action@v2
        with:
          branch: ${{ github.event_name != 'push' && !startsWith(github.head_ref, 'dependabot/') }}
          pr-title: ${{ github.event_name == 'pull_request' }}
      - name: Check exact branch name
        if: github.event_name == 'pull_request' || github.ref_type == 'branch'
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "$BRANCH" != dependabot/* && ( "$EVENT" == pull_request || "$BRANCH" != main ) ]]; then
            [[ "$BRANCH" =~ ^(feat|fix|perf|refactor|docs|style|test|build|ci|chore|revert)/[a-z0-9]+(-[a-z0-9]+)*$ ]]
          fi
      - name: Check every pushed commit
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess, tomllib
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          before = os.environ['BEFORE']
          known = before.strip('0') and subprocess.run(['git', 'cat-file', '-e', before + '^{commit}'], capture_output=True).returncode == 0
          if not known:
              main = subprocess.run(['git', 'rev-parse', '--verify', 'origin/main'], capture_output=True, text=True)
              base = subprocess.run(['git', 'merge-base', 'HEAD', 'origin/main'], capture_output=True, text=True) if main.returncode == 0 else None
              before = base.stdout.strip() if base is not None and base.returncode == 0 else ''
          rev = f'{before}..HEAD' if before else 'HEAD'
          pattern = tomllib.load(open('cchk.toml', 'rb'))['commit']['message_pattern']
          for sha in git('rev-list', rev).splitlines():
              message = git('show', '-s', '--format=%B', sha)
              if not re.fullmatch(pattern, message):
                  raise SystemExit(f'{sha}: invalid scoped Conventional Commit: {message.splitlines()[0]}')
          PY
