name: CI
on:
  push:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    uses: Hezric/Linen/.github/workflows/windows-checks.yml@v0.1.1
    with:
      manifest: src-tauri/Cargo.toml
      frontend: true
      build-command: vp exec tauri build --ci --no-bundle -- --locked
  test:
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test '${{ needs.verify.result }}' = success
  policy-check:
    uses: Hezric/Linen/.github/workflows/project-policy.yml@v0.1.1
  policy:
    needs: policy-check
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test '${{ needs.policy-check.result }}' = success
