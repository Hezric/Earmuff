name: CI
on:
  push:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    uses: Hezric/Linen/.github/workflows/windows-checks.yml@v0.1.5
    with:
      manifest: src-tauri/Cargo.toml
      frontend: true
      build-command: vp exec tauri build --ci --no-bundle -- --locked
  browser:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version: 1.4.0
          run-install: false
      - run: vp install --frozen-lockfile
      - run: vp exec playwright install chromium
      - name: Generate tray artwork and system comparison font
        shell: pwsh
        run: |
          vp run icons
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $fontRoot = Join-Path $env:RUNNER_TEMP 'segoe-fluent-icons'
          Invoke-WebRequest 'https://download.microsoft.com/download/e67899fc-9e91-433c-91c6-876b3b98d787/Segoe-Fluent-Icons.zip' -OutFile "$fontRoot.zip"
          Expand-Archive "$fontRoot.zip" $fontRoot
          $font = Get-ChildItem $fontRoot -Recurse -Filter '*.ttf' | Select-Object -First 1
          if (!$font) { throw 'Segoe Fluent Icons font missing' }
          "FLUENT_ICONS_FONT=$($font.FullName)" >> $env:GITHUB_ENV
      - run: vp run test:browser
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: flyout-geometry
          path: |
            playwright-results/
            assets/tray-*.svg
            src-tauri/icons/
            src-tauri/src/tray_assets.rs
  build-cache:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - run: pwsh -NoProfile -File scripts/test-build-cache.ps1
  test:
    needs: [verify, browser, build-cache]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test '${{ needs.verify.result }}' = success
      - run: test '${{ needs.build-cache.result }}' = success
      - run: test '${{ needs.browser.result }}' = success
  policy-check:
    uses: Hezric/Linen/.github/workflows/project-policy.yml@v0.1.5
  policy:
    needs: policy-check
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test '${{ needs.policy-check.result }}' = success
